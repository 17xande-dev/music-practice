services:
  music-practice:
    build: .
    restart: unless-stopped
    ports:
      - "8080"
    environment:
      # This deployment sits behind Cloudflare in Full (strict) mode, so
      # Traefik's own cert makes the connection genuinely HTTPS end to end —
      # HSTS is safe to send. See internal/config for what else is read.
      - HSTS=1
      # Accounts and synced history. On the named volume below, so a redeploy
      # keeps it; the image's /data is owned by the nonroot user it runs as.
      - DB_PATH=/data/music-practice.db
    volumes:
      - data:/data
    healthcheck:
      # The runtime image is distroless (no shell, no wget), so the binary
      # probes itself. Traefik ignores containers that are not healthy, so a
      # healthcheck that cannot run takes the whole site offline.
      test: ["CMD", "/music-practice", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  data:
