name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.8"
      # The same gate as a local `make check`: formatting, vet, type check,
      # lint, Deno tests, then bundle before the Go tests (with -race, then
      # govulncheck) so the embedded assets exist.
      - run: make check
      # Last on purpose: a newly published CVE must not hide the test results.
      # govulncheck fails only for vulnerabilities reachable from this module.
      - run: make vulncheck-install vulncheck

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t music-practice:ci .
